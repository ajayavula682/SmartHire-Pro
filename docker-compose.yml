version: '3.8'

# ============================================================
# SmartHire Pro — Docker Compose (LOCAL DEV ONLY)
# Secrets loaded from .env file (git-ignored).
# Production uses AWS ECS / EKS with Secrets Manager injection.
# ============================================================

services:

  # ─── MySQL 8 Database ─────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smarthire-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: smarthire_db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── SmartHire Pro Backend ────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthire-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
      - "9090:9090"    # Actuator/Prometheus port
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:dev}
      DB_URL: jdbc:mysql://mysql:3306/smarthire_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:86400000}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
    driver: local
