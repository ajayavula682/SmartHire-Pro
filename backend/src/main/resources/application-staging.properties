# ============================================================
# SmartHire Pro - STAGING Profile
# Active when: SPRING_PROFILES_ACTIVE=staging
# All values injected by CI/CD pipeline (GitHub Actions / Jenkins).
# NO secrets stored here — use AWS Secrets Manager / Vault.
# ============================================================

# ─── Database (RDS staging instance) ─────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── HikariCP Connection Pool (staging — moderate pool) ──────
spring.datasource.hikari.pool-name=SmartHire-Staging-Pool
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=45000

# ─── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ─── Mail ─────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Actuator: Limited exposure in staging ───────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# ─── Logging: Structured JSON for log aggregation ────────────
logging.level.com.smarthire=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ─── Swagger: Enabled in staging for QA team ─────────────────
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
