# ============================================================
# SmartHire Pro - BASE Configuration
# Shared across ALL environments (dev, staging, prod).
# Secrets and environment-specific values MUST live in
# profile-specific files or environment variables — NEVER here.
# ============================================================

spring.application.name=SmartHire Pro

# ─── Active Profile (override via env var or -Dspring.profiles.active) ───
# Default to 'dev'. CI/CD sets this to 'staging' or 'prod'.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ─── Server ──────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ─── File Upload (Resume) ────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads/resumes}

# ─── Flyway: Versioned DB Migrations ─────────────────────────
# ddl-auto=validate in prod — schema is ONLY changed via Flyway scripts
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# ─── Jackson ─────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ─── Springdoc / Swagger UI ──────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# Swagger is DISABLED in production (overridden in application-prod.properties)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ─── Actuator: Health & Metrics ──────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.info.env.enabled=true

# ─── App Info (shown in /actuator/info) ──────────────────────
info.app.name=SmartHire Pro
info.app.description=AI-Based Recruitment Management System
info.app.version=1.0.0

# ─── JWT (values injected via env vars — no defaults for secrets) ─
# Dev fallback provided for local run only. Prod MUST inject real JWT_SECRET.
jwt.secret=${JWT_SECRET:SmartHireDevSecretKey_ReplaceInProdWith256BitKey!}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
