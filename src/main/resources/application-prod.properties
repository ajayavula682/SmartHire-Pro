# ============================================================
# SmartHire Pro - PRODUCTION Profile
# Active when: SPRING_PROFILES_ACTIVE=prod
#
# ENTERPRISE RULES:
#   1. ZERO secrets in this file — all from AWS Secrets Manager
#      or injected as environment variables by the orchestrator.
#   2. Swagger/OpenAPI DISABLED — never expose API docs in prod.
#   3. ddl-auto=none — schema managed exclusively by Flyway.
#   4. SQL logging OFF — prevents PII/data leaks in logs.
#   5. HikariCP tuned for high concurrency.
#   6. Graceful shutdown with 30s drain window.
# ============================================================

# ─── Database (AWS RDS Multi-AZ) ─────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── HikariCP: Production-Tuned Pool ─────────────────────────
spring.datasource.hikari.pool-name=SmartHire-Prod-Pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-test-query=SELECT 1

# ─── JPA / Hibernate ─────────────────────────────────────────
# NEVER use update/create in prod — Flyway owns the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ─── Flyway: Strict mode in production ───────────────────────
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ─── Mail ─────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Actuator: Prometheus endpoint secured ───────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.server.port=9090

# ─── Logging: WARN only — no PII leak risk ───────────────────
logging.level.root=WARN
logging.level.com.smarthire=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF

# ─── Swagger: DISABLED in production ─────────────────────────
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ─── Server Security Headers ──────────────────────────────────
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
