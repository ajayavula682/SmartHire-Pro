# ============================================================
# SmartHire Pro - DEV Profile
# Active when: SPRING_PROFILES_ACTIVE=dev  (default)
#
# FOR LOCAL RUN WITHOUT DOCKER:
#   1. Install & start MySQL locally (port 3306)
#   2. Fill in DB_PASSWORD below (or set as env var)
#   3. Run: mvn spring-boot:run
#   4. Swagger UI: http://localhost:8080/api/swagger-ui.html
# ============================================================

# ─── Database (Local MySQL) ───────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/smarthire_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── HikariCP (dev — lightweight pool) ───────────────────────
spring.datasource.hikari.pool-name=SmartHire-Dev-Pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# ─── JPA / Hibernate ─────────────────────────────────────────
# validate: Flyway manages DDL — Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ─── Flyway ───────────────────────────────────────────────────
spring.flyway.enabled=true

# ─── Mail (set real values only if testing email features) ────
# Leave as placeholder for dev — mail sending is skipped if unconfigured
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dev@smarthire.local}
spring.mail.password=${MAIL_PASSWORD:dev_placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Actuator: Full exposure in dev ──────────────────────────
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ─── Logging: Verbose for dev debugging ──────────────────────
logging.level.com.smarthire=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.flywaydb=INFO

# ─── Swagger: Enabled in dev ─────────────────────────────────
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
